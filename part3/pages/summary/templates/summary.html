<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Summary</title>
        <link rel="stylesheet" href="{{ url_for('summary.static', filename='css/summary.css') }}"></head>
<body>
    <header>
        <div class="logo">
            <img src="{{ url_for('static', filename='media/img/logo.jpg') }}" alt="Cook Master Logo">
        </div>
        <nav>
            <ul>
                <li><a href="{{ url_for('index.homepage') }}">Home</a></li>
                <li><a href="{{ url_for('workshops.workshops_page') }}">Workshops</a></li>
                <li><a href="{{ url_for('signup.signup') }}">Sign Up</a></li>
                <li><a href="{{ url_for('login.login') }}">Login</a></li>
                <li><a href="{{ url_for('contact.contact') }}">Contact</a></li>
                {% if session['user'] %}
                     <a href="{{ url_for('logout.logout') }}">Logout</a>
                {% endif %}
            </ul>
        </nav>
    </header>
<script src="{{ url_for('summary.static', filename='js/summary.js') }}"></script>



    <!-- Main Content -->
    <main>
    <h1>Your first step to becoming a chef is done!</h1>
    <section id="summary-details" class="summary-section">
        <p><strong>Workshop:</strong> <span id="workshop"></span></p>
        <p><strong>Date:</strong> <span id="date"></span></p>
        <p><strong>Time:</strong> <span id="time"></span></p>
        <p><strong>Number of Participants:</strong> <span id="participants"></span></p>
    </section>
</main>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const params = new URLSearchParams(window.location.search);

        document.getElementById("workshop").textContent = params.get("workshop") || "No workshop selected";
        document.getElementById("date").textContent = params.get("date") || "No date selected";
        document.getElementById("time").textContent = params.get("time") || "No time selected";
        document.getElementById("participants").textContent = params.get("participants") || "No participants specified";
    });
</script>

 <!-- חיבור קובץ ה-JavaScript -->
        <script src="{{ url_for('summary.static', filename='js/summary.js') }}"></script>

</body>
</html>
